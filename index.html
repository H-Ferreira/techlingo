const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const nowISO=()=>new Date().toISOString();
const todayKey=(d=new Date())=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function allTerms(){return [...DATA.terms,...state.customTerms]}
function loadJSON(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function saveState(immediate=false){state.lastSavedAt=nowISO();const run=()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));localStorage.setItem(UI_KEY,JSON.stringify(ui))}catch(e){toast('Não foi possível salvar no navegador.')}updateTop()};if(immediate){clearTimeout(saveTimer);run()}else{clearTimeout(saveTimer);saveTimer=setTimeout(run,120)}}
function saveUI(){try{localStorage.setItem(UI_KEY,JSON.stringify(ui))}catch(e){}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2200)}
function mastery(id){return state.mastery[id]||{level:0,seen:0,correct:0,wrong:0,due:0,last:null,interval:0}}
function dueTerms(){const n=Date.now();return allTerms().filter(t=>{const m=mastery(t.id);return m.seen>0&&m.due<=n})}
function unseenTerms(mid){return allTerms().filter(t=>t.module===mid&&mastery(t.id).seen===0)}
function moduleTerms(mid){return allTerms().filter(t=>t.module===mid)}
function moduleProgress(mid){const ts=moduleTerms(mid);if(!ts.length)return 0;return Math.round(ts.reduce((a,t)=>a+Math.min(5,mastery(t.id).level),0)/(ts.length*5)*100)}
function completedModule(mid){return moduleProgress(mid)>=60}
function isUnlocked(index){return index===0||completedModule(DATA.modules[index-1].id)||(state.moduleXP[DATA.modules[index-1].id]||0)>=60}
function updateStreak(){const last=state.lastStudyDate;if(!last)return;const td=todayKey();if(last===td)return;const d=new Date();d.setDate(d.getDate()-1);if(last!==todayKey(d))state.streak=0}
function recordStudy(xp){const td=todayKey();if(state.lastStudyDate!==td){const d=new Date();d.setDate(d.getDate()-1);state.streak=state.lastStudyDate===todayKey(d)?state.streak+1:1;state.lastStudyDate=td}state.xp+=xp;state.dailyXP[td]=(state.dailyXP[td]||0)+xp}
function updateTop(){updateStreak();$('#streakTop').textContent=state.streak;$('#xpTop').textContent=state.xp;$('#goalTop').textContent=`${state.dailyXP[todayKey()]||0}/${state.dailyGoal}`}

function renderHome(){const due=dueTerms().length,total=allTerms().length,known=allTerms().filter(t=>mastery(t.id).level>=3).length,today=state.dailyXP[todayKey()]||0;$('#homeContent').innerHTML=`<section class="hero"><div><div class="eyebrow">Auditor Fiscal de TI • Inglês técnico</div><h1>Leia termos de TI sem depender de tradução.</h1><p>${total} termos distribuídos em ${DATA.modules.length} módulos. Lições curtas, áudio nativo do navegador, recordação ativa e revisão espaçada.</p><div class="hero-actions"><button class="btn primary" data-start="smart">Continuar aprendendo</button><button class="btn blue" data-action="review-due">Revisar ${due} termos</button></div></div><div class="hero-art"><div class="orbit"></div><div class="mascot">💻</div></div></section><div class="kpis"><div class="kpi"><span>VOCABULÁRIO</span><strong>${total}</strong></div><div class="kpi"><span>DOMINADOS</span><strong>${known}</strong></div><div class="kpi"><span>PARA REVISAR</span><strong>${due}</strong></div><div class="kpi"><span>META HOJE</span><strong>${today}/${state.dailyGoal}</strong></div></div><div class="section-head"><div><h2>Próximos módulos</h2><p>A trilha libera progressivamente, mas o dicionário permanece aberto.</p></div><button class="btn small" data-page="path">Ver trilha</button></div><div class="review-grid">${DATA.modules.slice(0,6).map((m,i)=>moduleCard(m,i)).join('')}</div>`;bindCommon()}

function renderReview(){const due=dueTerms(),weak=allTerms().filter(t=>{const m=mastery(t.id);return m.seen>0&&m.level<3}).length,fav=state.favorites.length;$('#reviewContent').innerHTML=`<div class="section-head"><div><h2>Central de revisão</h2><p>O algoritmo prioriza termos vencidos, fracos e errados.</p></div></div><div class="review-grid"><article class="card"><h3>Revisão vencida</h3><p class="muted">${due.length} termos estão prontos para uma nova tentativa.</p><button class="btn primary" data-action="review-due" ${due.length?'':'disabled'}>Iniciar revisão</button></article><article class="card"><h3>Termos fracos</h3><p class="muted">${weak} termos ainda não atingiram domínio intermediário.</p><button class="btn blue" data-start="weak" ${weak?'':'disabled'}>Praticar fracos</button></article><article class="card"><h3>Favoritos</h3><p class="muted">${fav} termos foram marcados por você.</p><button class="btn" data-start="favorites" ${fav?'':'disabled'}>Praticar favoritos</button></article><article class="card"><h3>Desafio misto</h3><p class="muted">Mistura toda a trilha já desbloqueada.</p><button class="btn" data-start="mixed">Começar desafio</button></article></div><div class="section-head"><div><h2>Fila atual</h2><p>Primeiros termos com revisão programada.</p></div></div><div class="word-list">${due.slice(0,12).map(wordCard).join('')||'<div class="card muted">Nenhuma revisão vencida. Continue uma lição para alimentar a fila.</div>'}</div>`;bindCommon();bindWordActions()}
function wordCard(t){const m=moduleMap[t.module]||{title:'Personalizado',color:varFallback()};const fav=state.favorites.includes(t.id);return `<article class="word-card"><div><div class="word-en">${esc(t.en)}</div><div class="word-pt">${esc(t.pt)}</div><small class="muted">${esc(m.title)} • nível ${mastery(t.id).level}/5</small></div><div class="word-def">${esc(t.definition)}</div><div class="word-actions"><button class="btn small" data-speak="${t.id}" title="Ouvir">🔊</button><button class="btn small star" data-fav="${t.id}" title="Favoritar">${fav?'★':'☆'}</button></div></article>`}

function renderDictionary(){const terms=filteredTerms(),per=30,pages=Math.max(1,Math.ceil(terms.length/per));ui.dictPage=Math.min(ui.dictPage,pages);const slice=terms.slice((ui.dictPage-1)*per,ui.dictPage*per);$('#dictionaryContent').innerHTML=`<div class="section-head"><div><h2>Dicionário técnico</h2><p>Pesquise em inglês, português ou pela definição.</p></div><button class="btn primary small" id="openTermModal">+ Termo</button></div><div class="dictionary-tools"><input class="field" id="dictSearch" value="${esc(ui.dictQuery)}" placeholder="Pesquisar termo ou conceito"><select class="field" id="dictModule"><option value="all">Todos os módulos</option>${DATA.modules.map(m=>`<option value="${m.id}" ${ui.dictModule===m.id?'selected':''}>${m.icon}. ${esc(m.title)}</option>`).join('')}</select><select class="field" id="dictFilter"><option value="all" ${ui.dictFilter==='all'?'selected':''}>Todos</option><option value="unseen" ${ui.dictFilter==='unseen'?'selected':''}>Não vistos</option><option value="weak" ${ui.dictFilter==='weak'?'selected':''}>Fracos</option><option value="mastered" ${ui.dictFilter==='mastered'?'selected':''}>Dominados</option><option value="favorites" ${ui.dictFilter==='favorites'?'selected':''}>Favoritos</option></select><button class="btn" id="clearDict">Limpar</button></div><div class="muted" style="margin-bottom:10px">${terms.length} termo(s) encontrado(s).</div><div class="word-list">${slice.map(wordCard).join('')||'<div class="card muted">Nenhum termo encontrado.</div>'}</div><div class="pagination"><button class="btn small" id="prevDict" ${ui.dictPage<=1?'disabled':''}>Anterior</button><strong>${ui.dictPage}/${pages}</strong><button class="btn small" id="nextDict" ${ui.dictPage>=pages?'disabled':''}>Próxima</button></div>`;$('#dictSearch').oninput=e=>{ui.dictQuery=e.target.value;ui.dictPage=1;saveUI();renderDictionary()};$('#dictModule').onchange=e=>{ui.dictModule=e.target.value;ui.dictPage=1;saveUI();renderDictionary()};$('#dictFilter').onchange=e=>{ui.dictFilter=e.target.value;ui.dictPage=1;saveUI();renderDictionary()};$('#clearDict').onclick=()=>{ui.dictQuery='';ui.dictModule='all';ui.dictFilter='all';ui.dictPage=1;saveUI();renderDictionary()};$('#prevDict').onclick=()=>{ui.dictPage--;saveUI();renderDictionary();scrollTo({top:0})};$('#nextDict').onclick=()=>{ui.dictPage++;saveUI();renderDictionary();scrollTo({top:0})};$('#openTermModal').onclick=()=>openTermModal();bindWordActions()}
function filteredTerms(){const q=normalize(ui.dictQuery);return allTerms().filter(t=>{if(ui.dictModule!=='all'&&t.module!==ui.dictModule)return false;const m=mastery(t.id);if(ui.dictFilter==='unseen'&&m.seen>0)return false;if(ui.dictFilter==='weak'&&!(m.seen>0&&m.level<3))return false;if(ui.dictFilter==='mastered'&&m.level<3)return false;if(ui.dictFilter==='favorites'&&!state.favorites.includes(t.id))return false;if(q&&!normalize(`${t.en} ${t.pt} ${t.definition}`).includes(q))return false;return true})}
function renderProgress(){const total=allTerms().length,seen=allTerms().filter(t=>mastery(t.id).seen>0).length,mastered=allTerms().filter(t=>mastery(t.id).level>=3).length,correct=Object.values(state.mastery).reduce((a,m)=>a+(m.correct||0),0),wrong=Object.values(state.mastery).reduce((a,m)=>a+(m.wrong||0),0),acc=correct+wrong?Math.round(correct/(correct+wrong)*100):0;$('#progressContent').innerHTML=`<div class="section-head"><div><h2>Seu progresso</h2><p>Indicadores calculados a partir das respostas salvas localmente.</p></div></div><div class="kpis"><div class="kpi"><span>XP TOTAL</span><strong>${state.xp}</strong></div><div class="kpi"><span>TERMOS VISTOS</span><strong>${seen}/${total}</strong></div><div class="kpi"><span>DOMINADOS</span><strong>${mastered}</strong></div><div class="kpi"><span>ACERTO</span><strong>${acc}%</strong></div></div><div class="progress-grid"><article class="card"><h3>Domínio por módulo</h3><div class="chart-bars">${DATA.modules.map(m=>{const p=moduleProgress(m.id);return `<div class="chart-row"><span>${m.icon}. ${esc(m.title)}</span><div class="chart-bar"><i style="width:${p}%;background:${m.color}"></i></div><b>${p}%</b></div>`}).join('')}</div></article><article class="card"><h3>Últimas sessões</h3>${state.sessions.slice(-12).reverse().map(s=>`<div class="backup-item"><div><strong>${new Date(s.at).toLocaleString('pt-BR')}</strong><div class="muted">${esc(s.label)} • ${s.correct}/${s.total}</div></div><b>+${s.xp} XP</b></div>`).join('')||'<p class="muted">Nenhuma sessão concluída ainda.</p>'}</article></div>`}
function renderSettings(){const backups=loadJSON(BACKUP_KEY,[]);$('#settingsContent').innerHTML=`<div class="section-head"><div><h2>Ajustes e backup</h2><p>O progresso é salvo após cada alteração.</p></div></div><div class="settings-grid"><article class="card"><h3>Aprendizagem</h3><div class="form-grid"><label>Meta diária de XP<input class="field" id="dailyGoal" type="number" min="5" max="500" value="${state.dailyGoal}"></label><label>Questões por sessão<select class="field" id="sessionSize">${[8,10,12,15,20].map(n=>`<option ${state.settings.sessionSize===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Tamanho do texto<input class="field" id="fontSize" type="range" min="0.85" max="1.25" step="0.05" value="${state.settings.font}"></label><label>Tema<select class="field" id="theme"><option value="light" ${state.settings.theme==='light'?'selected':''}>Claro</option><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Escuro</option></select></label><label><input type="checkbox" id="sound" ${state.settings.sound?'checked':''}> Sons de resposta</label><label>Voz do navegador<select class="field" id="voiceSelect"><option value="">Automática</option>${voices.map(v=>`<option value="${esc(v.name)}" ${state.settings.voice===v.name?'selected':''}>${esc(v.name)} — ${esc(v.lang)}</option>`).join('')}</select></label></div></article><article class="card app-install-card"><h3>Aplicativo no celular</h3><div id="appInstallStatus" class="muted">Verificando a instalação...</div><div class="app-install-row"><button class="btn primary" id="installAppBtn" type="button">Instalar aplicativo</button><span class="standalone-badge" id="standaloneBadge" hidden>✓ Instalado</span></div><div class="app-install-note">Depois de instalado, o aplicativo abre em tela cheia e funciona sem internet. No iPhone, use Safari → Compartilhar → Adicionar à Tela de Início. No Android, use o botão acima ou o menu do navegador → Instalar aplicativo.</div></article><article class="card"><h3>Backups</h3><p class="muted">Backups internos são criados nos dois períodos diários: após 08h e após 20h, quando o site é aberto. O navegador não permite garantir download automático com o site fechado.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="exportBackup">Exportar JSON</button><button class="btn" id="importBackup">Importar JSON</button><button class="btn" id="createBackup">Criar backup interno</button></div><div class="backup-list">${backups.slice().reverse().slice(0,10).map((b,i)=>`<div class="backup-item"><div><strong>${esc(b.slot||'Manual')}</strong><div class="muted">${new Date(b.at).toLocaleString('pt-BR')}</div></div><button class="btn small" data-restore-backup="${backups.length-1-i}">Restaurar</button></div>`).join('')||'<p class="muted">Nenhum backup interno criado.</p>'}</div></article><article class="card"><h3>Dados</h3><p class="muted">Último salvamento: ${state.lastSavedAt?new Date(state.lastSavedAt).toLocaleString('pt-BR'):'ainda não registrado'}.</p><button class="btn red" id="resetProgress">Apagar todo o progresso</button></article><article class="card"><h3>Sobre o método</h3><p class="muted">A trilha usa lições curtas, recordação ativa e revisão espaçada. O nível de cada termo sobe com acertos e volta a ser revisado em intervalos crescentes.</p><p class="muted">Conteúdo inicial: ${DATA.terms.length} termos. Termos personalizados: ${state.customTerms.length}.</p></article></div>`;bindSettings(backups)}
function bindSettings(backups){bindInstallControls();$('#dailyGoal').onchange=e=>{state.dailyGoal=Math.max(5,Number(e.target.value)||30);saveState(true)};$('#sessionSize').onchange=e=>{state.settings.sessionSize=Number(e.target.value);saveState(true)};$('#fontSize').oninput=e=>{state.settings.font=Number(e.target.value);applySettings();saveState()};$('#theme').onchange=e=>{state.settings.theme=e.target.value;applySettings();saveState(true)};$('#sound').onchange=e=>{state.settings.sound=e.target.checked;saveState(true)};$('#voiceSelect').onchange=e=>{state.settings.voice=e.target.value;saveState(true);speak('Technology')};$('#exportBackup').onclick=exportBackup;$('#importBackup').onclick=()=>$('#importFile').click();$('#createBackup').onclick=()=>{createInternalBackup('Manual');renderSettings();toast('Backup interno criado.')};$$('[data-restore-backup]').forEach(b=>b.onclick=()=>restoreInternalBackup(Number(b.dataset.restoreBackup),backups));$('#resetProgress').onclick=()=>{if(confirm('Apagar todo o progresso, termos personalizados e configurações?')){createInternalBackup('Antes de apagar');localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(UI_KEY);location.reload()}}}
function applySettings(){document.documentElement.dataset.theme=state.settings.theme;document.documentElement.style.setProperty('--font',state.settings.font)}
function bindCommon(){$$('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$$('[data-module-start]').forEach(b=>b.onclick=()=>startModule(b.dataset.moduleStart,Number(b.dataset.lesson||1)));$$('[data-start]').forEach(b=>b.onclick=()=>startSmart(b.dataset.start));$$('[data-action="review-due"]').forEach(b=>b.onclick=()=>startReview())}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function sample(a,n){return shuffle(a).slice(0,n)}
function startSmart(mode='smart'){let pool=[];if(mode==='weak')pool=allTerms().filter(t=>{const m=mastery(t.id);return m.seen>0&&m.level<3});else if(mode==='favorites')pool=allTerms().filter(t=>state.favorites.includes(t.id));else if(mode==='mixed')pool=allTerms().filter(t=>isUnlocked(DATA.modules.findIndex(m=>m.id===t.module)));else{const due=dueTerms();if(due.length)pool=due;else{const idx=DATA.modules.findIndex((m,i)=>isUnlocked(i)&&moduleProgress(m.id)<60);pool=moduleTerms((DATA.modules[idx<0?0:idx]).id)}}startSession(sample(pool,Math.max(state.settings.sessionSize,8)),mode==='weak'?'Termos fracos':mode==='favorites'?'Favoritos':mode==='mixed'?'Desafio misto':'Prática inteligente',false)}

function startModule(mid,lesson=1){const idx=DATA.modules.findIndex(m=>m.id===mid);if(!isUnlocked(idx)){toast('Conclua o módulo anterior para liberar este.');return}const all=moduleTerms(mid),unseen=unseenTerms(mid),due=all.filter(t=>mastery(t.id).seen>0&&mastery(t.id).due<=Date.now()),weak=all.filter(t=>{const m=mastery(t.id);return m.seen>0&&m.level<3});let pool=[];if(lesson===1)pool=[...sample(unseen,6),...sample(weak,6)];if(lesson===2)pool=[...sample(due,5),...sample(weak,9),...sample(unseen,3)];if(lesson===3)pool=sample(all,Math.max(state.settings.sessionSize,14));if(!pool.length)pool=sample(all,state.settings.sessionSize);startSession([...new Map(pool.map(t=>[t.id,t])).values()].slice(0,Math.max(state.settings.sessionSize,8)),`${moduleMap[mid].title} — Lição ${lesson}`,true,mid)}
function startSession(pool,label,introduce=true,mid=null){if(!pool.length){toast('Não há termos disponíveis para esta prática.');return}const newOnes=introduce?pool.filter(t=>mastery(t.id).seen===0).slice(0,5):[];const questions=[];newOnes.forEach(t=>questions.push({type:'intro',term:t}));const target=Math.max(state.settings.sessionSize,pool.length);for(let i=0;i<target;i++){const t=pool[i%pool.length];questions.push(makeQuestion(t,i))}session={label,mid,questions,index:0,correct:0,wrong:0,hearts:5,selected:null,checked:false,typed:'',earned:0};$('#sessionOverlay').classList.add('open');document.body.style.overflow='hidden';renderExercise()}
function makeQuestion(t,i){const m=mastery(t.id);let types=m.seen===0?['en-pt','definition']:m.level<2?['en-pt','pt-en','definition','listen']:['en-pt','pt-en','definition','listen','type'];return {type:types[i%types.length],term:t}}
function distractors(t,field){let pool=moduleTerms(t.module).filter(x=>x.id!==t.id);if(pool.length<3)pool=allTerms().filter(x=>x.id!==t.id);return sample(pool,3).map(x=>x[field])}
function renderExercise(){const q=session.questions[session.index],total=session.questions.length;$('#sessionProgress').style.width=`${Math.round(session.index/total*100)}%`;$('#sessionHearts').textContent=`♥ ${session.hearts}`;const ex=$('#exercise'),foot=$('#sessionFooter'),copy=$('#feedbackCopy'),action=$('#sessionAction');foot.className='session-footer';copy.innerHTML='';session.selected=null;session.checked=false;session.typed='';action.textContent=q.type==='intro'?'CONTINUAR':'VERIFICAR';action.className='btn primary';if(q.type==='intro'){ex.innerHTML=`<div class="exercise-kicker">Novo termo</div><div class="intro-card"><button class="speaker" data-current-speak>🔊</button><div class="term-big">${esc(q.term.en)}</div><div class="intro-translation">${esc(q.term.pt)}</div><div class="intro-def">${esc(q.term.definition)}</div>${q.term.note?`<div class="intro-def"><b>Atenção:</b> ${esc(q.term.note)}</div>`:''}</div>`}else if(q.type==='en-pt'){const opts=shuffle([q.term.pt,...distractors(q.term,'pt')]);ex.innerHTML=`<div class="exercise-kicker">Escolha a tradução</div><h2>O que significa:</h2><div class="term-big">${esc(q.term.en)}</div><div class="options">${opts.map(o=>`<button class="option" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}else if(q.type==='pt-en'){const opts=shuffle([q.term.en,...distractors(q.term,'en')]);ex.innerHTML=`<div class="exercise-kicker">Escolha o termo em inglês</div><h2>${esc(q.term.pt)}</h2><div class="options">${opts.map(o=>`<button class="option" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}else if(q.type==='definition'){const opts=shuffle([q.term.en,...distractors(q.term,'en')]);ex.innerHTML=`<div class="exercise-kicker">Identifique pelo conceito</div><h2>${esc(q.term.definition)}</h2><div class="options">${opts.map(o=>`<button class="option" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}else if(q.type==='listen'){const opts=shuffle([q.term.en,...distractors(q.term,'en')]);ex.innerHTML=`<div class="exercise-kicker">Exercício de escuta</div><h2>Ouça e escolha o termo:</h2><button class="speaker" data-current-speak>🔊</button><div class="options" style="margin-top:18px">${opts.map(o=>`<button class="option" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;setTimeout(()=>speak(q.term.en),180)}else{ex.innerHTML=`<div class="exercise-kicker">Digite em inglês</div><h2>${esc(q.term.pt)}</h2><input class="typing" id="typingAnswer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Digite o termo em inglês">`}
$$('[data-answer]').forEach(b=>b.onclick=()=>{if(session.checked)return;$$('[data-answer]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');session.selected=b.dataset.answer});$$('[data-current-speak]').forEach(b=>b.onclick=()=>speak(q.term.en));const inp=$('#typingAnswer');if(inp){inp.oninput=e=>session.typed=e.target.value;inp.onkeydown=e=>{if(e.key==='Enter')handleSessionAction()};setTimeout(()=>inp.focus(),60)}action.onclick=handleSessionAction}
function handleSessionAction(){const q=session.questions[session.index];if(q.type==='intro'){touchSeen(q.term.id);nextQuestion();return}if(session.checked){nextQuestion();return}let answer=q.type==='type'?session.typed:session.selected;if(!answer){toast('Responda antes de verificar.');return}const expected=(q.type==='en-pt'?q.term.pt:q.term.en),ok=normalize(answer)===normalize(expected);session.checked=true;const foot=$('#sessionFooter'),copy=$('#feedbackCopy'),action=$('#sessionAction');foot.classList.add(ok?'ok':'bad');copy.innerHTML=`<strong>${ok?'Correto!':'Resposta correta: '+esc(expected)}</strong><span>${esc(q.term.definition)}</span>`;action.textContent='CONTINUAR';action.className=`btn ${ok?'primary':'red'}`;if(q.type!=='type')$$('[data-answer]').forEach(b=>{if(normalize(b.dataset.answer)===normalize(expected))b.classList.add('correct');else if(b.classList.contains('selected')&&!ok)b.classList.add('wrong')});else $('#typingAnswer').style.borderColor=ok?'var(--green)':'var(--red)';updateMastery(q.term.id,ok);if(ok){session.correct++;session.earned+=5;playTone(true)}else{session.wrong++;session.hearts=Math.max(0,session.hearts-1);playTone(false)}saveState(true)}
function touchSeen(id){const m=mastery(id);state.mastery[id]={...m,seen:m.seen+1,last:nowISO(),due:Date.now()+5*60*1000};saveState(true)}
function updateMastery(id,ok){const m=mastery(id),level=Math.max(0,Math.min(5,m.level+(ok?1:-1))),intervals=[0,10*60*1000,24*3600*1000,3*24*3600*1000,7*24*3600*1000,21*24*3600*1000];state.mastery[id]={...m,level,seen:m.seen+1,correct:m.correct+(ok?1:0),wrong:m.wrong+(ok?0:1),last:nowISO(),interval:intervals[level],due:Date.now()+intervals[level]}}
function nextQuestion(){session.index++;if(session.index>=session.questions.length){finishSession();return}renderExercise()}
function finishSession(){recordStudy(session.earned);if(session.mid)state.moduleXP[session.mid]=(state.moduleXP[session.mid]||0)+session.earned;state.sessions.push({at:nowISO(),label:session.label,correct:session.correct,total:session.correct+session.wrong,xp:session.earned});state.sessions=state.sessions.slice(-100);saveState(true);$('#sessionProgress').style.width='100%';$('#sessionHearts').textContent='✓';$('#exercise').innerHTML=`<div class="results"><div class="results-badge">🏆</div><h2>Lição concluída</h2><p class="muted">${esc(session.label)}</p><div class="result-stats"><div class="result-stat"><strong>${session.earned}</strong><span>XP</span></div><div class="result-stat"><strong>${session.correct}</strong><span>acertos</span></div><div class="result-stat"><strong>${session.wrong}</strong><span>erros</span></div></div></div>`;const foot=$('#sessionFooter');foot.className='session-footer ok';$('#feedbackCopy').innerHTML='<strong>Progresso salvo</strong><span>Os termos foram programados para novas revisões.</span>';const a=$('#sessionAction');a.textContent='CONCLUIR';a.className='btn primary';a.onclick=closeSession}
function closeSession(){if(session&&session.index<session.questions.length&&!confirm('Sair desta lição? O progresso já respondido será mantido.'))return;$('#sessionOverlay').classList.remove('open');document.body.style.overflow='';session=null;renderPage(ui.page)}
function playTone(ok){if(!state.settings.sound)return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?660:220;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(ui.page==='settings')renderSettings()}
function speak(text){if(!('speechSynthesis'in window)){toast('Leitura em voz não disponível neste navegador.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const chosen=voices.find(v=>v.name===state.settings.voice)||voices.find(v=>/^en-US/i.test(v.lang))||voices[0];if(chosen)u.voice=chosen;u.lang=chosen?.lang||'en-US';u.rate=.86;speechSynthesis.speak(u)}
function openTermModal(){$('#customModule').innerHTML=DATA.modules.map(m=>`<option value="${m.id}">${m.icon}. ${esc(m.title)}</option>`).join('');$('#termModal').classList.add('open')}
function closeModal(){$('#termModal').classList.remove('open')}
function saveCustomTerm(){const en=$('#customEn').value.trim(),pt=$('#customPt').value.trim(),definition=$('#customDef').value.trim(),mid=$('#customModule').value;if(!en||!pt||!definition){toast('Preencha termo, tradução e definição.');return}const id=`custom-${Date.now()}`;state.customTerms.push({id,module:mid,en,pt,definition,note:'Termo personalizado'});saveState(true);closeModal();renderDictionary();toast('Termo adicionado.')}
function createInternalBackup(slot='Manual'){const arr=loadJSON(BACKUP_KEY,[]);const payload=JSON.parse(JSON.stringify(state));arr.push({at:nowISO(),slot,payload});localStorage.setItem(BACKUP_KEY,JSON.stringify(arr.slice(-30)))}
function ensureScheduledBackups(){const arr=loadJSON(BACKUP_KEY,[]),td=todayKey(),h=new Date().getHours(),slots=[];if(h>=8)slots.push(`${td} 08h`);if(h>=20)slots.push(`${td} 20h`);let changed=false;for(const slot of slots){if(!arr.some(b=>b.slot===slot)){arr.push({at:nowISO(),slot,payload:JSON.parse(JSON.stringify(state))});changed=true}}if(changed)localStorage.setItem(BACKUP_KEY,JSON.stringify(arr.slice(-30)))}
function exportBackup(){const data={app:'TechLingo TI',exportedAt:nowISO(),state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`TechLingo_TI_backup_${todayKey()}_${new Date().toTimeString().slice(0,8).replaceAll(':','-')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup exportado.')}
function restoreInternalBackup(i,arr){if(!arr[i]||!confirm('Restaurar este backup e substituir o estado atual?'))return;createInternalBackup('Antes da restauração');state={...defaultState(),...arr[i].payload,settings:{...defaultState().settings,...(arr[i].payload.settings||{})}};saveState(true);applySettings();renderPage(ui.page);toast('Backup restaurado.')}
function importBackupFile(file){const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result),incoming=obj.state||obj;if(!incoming||typeof incoming!=='object')throw new Error();if(!confirm('Importar este backup e substituir o progresso atual?'))return;createInternalBackup('Antes da importação');state={...defaultState(),...incoming,settings:{...defaultState().settings,...(incoming.settings||{})}};saveState(true);applySettings();renderPage(ui.page);toast('Backup importado.')}catch(e){toast('Arquivo de backup inválido.')}};r.readAsText(file)}
$('#closeSession').onclick=closeSession;$('#saveCustomTerm').onclick=saveCustomTerm;$$('[data-close-modal]').forEach(b=>b.onclick=closeModal);$('#termModal').onclick=e=>{if(e.target.id==='termModal')closeModal()};$('#importFile').onchange=e=>{if(e.target.files[0])importBackupFile(e.target.files[0]);e.target.value=''};window.addEventListener('beforeunload',()=>saveState(true));document.addEventListener('visibilitychange',()=>{if(document.hidden)saveState(true)});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sessionOverlay').classList.contains('open'))closeSession()});if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}

let deferredInstallPrompt=null;
const isIOSDevice=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandaloneMode=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
function installMessage(){
  if(isStandaloneMode())return 'O TechLingo TI já está instalado e executando em modo aplicativo.';
  if(deferredInstallPrompt)return 'O aplicativo está pronto para ser instalado neste aparelho.';
  if(isIOSDevice())return 'No Safari, toque em Compartilhar e depois em Adicionar à Tela de Início.';
  return 'Abra o menu do navegador e escolha Instalar aplicativo ou Adicionar à tela inicial.';
}
function updateInstallControls(){
  const chip=$('#installChip'),btn=$('#installAppBtn'),status=$('#appInstallStatus'),badge=$('#standaloneBadge');
  const installed=isStandaloneMode();
  if(chip)chip.classList.toggle('show',!installed&&!!deferredInstallPrompt);
  if(status)status.textContent=installMessage();
  if(btn){btn.hidden=installed;btn.disabled=false;btn.textContent=isIOSDevice()?'Ver instruções de instalação':'Instalar aplicativo';}
  if(badge)badge.hidden=!installed;
}
async function installTechLingoApp(){
  if(isStandaloneMode()){toast('O aplicativo já está instalado.');return}
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice=await deferredInstallPrompt.userChoice;
    if(choice.outcome==='accepted')toast('Instalação iniciada.');
    deferredInstallPrompt=null;updateInstallControls();return;
  }
  if(isIOSDevice())alert('No Safari: toque no botão Compartilhar e selecione “Adicionar à Tela de Início”.');
  else alert('Abra o menu do navegador e selecione “Instalar aplicativo” ou “Adicionar à tela inicial”.');
}
function bindInstallControls(){const btn=$('#installAppBtn');if(btn)btn.onclick=installTechLingoApp;updateInstallControls()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;updateInstallControls()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;updateInstallControls();toast('TechLingo TI instalado.')});
const installChip=$('#installChip');if(installChip)installChip.onclick=installTechLingoApp;
async function requestPersistentStorage(){try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}}
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
requestPersistentStorage();

const launchPage=location.hash.slice(1);if(navItems.some(([id])=>id===launchPage))ui.page=launchPage;applySettings();ensureScheduledBackups();setInterval(ensureScheduledBackups,30*60*1000);updateStreak();renderNav();showPage(ui.page||'home');
</script>
